name: Funding Societies
description: 'Funding Societies (known as Modalku in Indonesia) is Southeast Asia''s
  largest unified SME digital finance platform, founded in 2015 and operating across
  Singapore, Indonesia, Malaysia, Thailand and Vietnam. It provides small and medium-sized
  enterprises with business financing — term loans, micro loans, revolving credit
  lines, invoice and trade financing — and offers retail and institutional investors
  the ability to fund those loans for a return. The group is licensed and regulated
  in its markets and is backed by investors including SoftBank Vision Fund, Sequoia,
  and SoftBank Ventures Asia. Funding Societies does not currently publish a public
  developer API or SDK program; this API Evangelist profile captures the company''s
  public web properties and security posture. It will be upgraded if and when a public
  API surface is published.'
